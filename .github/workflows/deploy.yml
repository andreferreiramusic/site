name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Rebuilds daily so events drop off the home page once they've been played —
  # which of the upcoming four show is decided at build time, not in the browser.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Rebuilds all six pages from templates/ + content/ before the artifact
      # is packed, so which events count as upcoming is decided on the deploy
      # date and the rows ship as crawlable markup.
      - name: Build site
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
