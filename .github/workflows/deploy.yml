name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Picks up Google Sheet edits without anyone touching the repo. Use the
  # "Run workflow" button on the Actions tab to publish a change immediately.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Writes the concert rows into index.html before the artifact is packed,
      # so the dates ship as crawlable markup. Soft-fails to the committed rows.
      - name: Build concert list from the Google Sheet
        run: python3 scripts/build_concerts.py
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
